name: Continuous Integration

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18 for projects that are still on it; 22 and 24: maintained LTS lines.
        node-version: ['18', '22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the pnpm version from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install requirements
        run: |
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm run ci

      # Disabled for now: codecov-action@v1 is the deprecated uploader, and a
      # third-party step in CI needs a vetted setup (current action pinned to a
      # commit SHA, minimal permissions, repo-only CODECOV_TOKEN). Coverage is
      # still printed in the job log by `pnpm run ci`.
      # - name: Upload coverage report
      #   uses: codecov/codecov-action@v1
